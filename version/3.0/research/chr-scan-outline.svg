      <path d="M 6 32 L 7 22"/>
      <path d="M 7 22 L 6 20"/>
      <path d="M 6 20 L 5 22"/>
    </g>
  </g>
  <g transform="translate(255 48)">
    <text x="0" y="0" font-family="monospace" font-size="16">0x3A</text>
    <g transform="translate(20 -20) scale(4)" fill="none" stroke="black" stroke-width="0.4">
      <path d="M 0 60 L 0 52"/>
