<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">RIPtel BOLD.CHR quote, colon and equals stroke geometry</title>
  <desc id="desc">Original MoveToEx and LineTo vectors at unit scale. Closed contours remain outlines; SCAN records add no painting or connections. This is a geometry oracle, not a Windows pixel rendering.</desc>
  <rect width="720" height="360" fill="white"/>
  <g font-family="monospace" font-size="16" fill="black">
    <text x="20" y="24">BOLD.CHR: original stroke geometry, no fill</text>
    <text x="20" y="344">SCAN adds no line, fill, closure or pen movement.</text>
  </g>
  <g transform="translate(20 48)">
    <text x="0" y="0" font-family="monospace" font-size="16">0x22</text>
    <g transform="translate(20 -20) scale(4)" fill="none" stroke="black" stroke-width="0.4">
      <path d="M 0 22 L 1 32"/>
